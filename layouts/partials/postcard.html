{{ $post := .post }}
{{ $variant := add (mod .index 4) 1 }}
<article class="post-card">
	<a href="{{ $post.Permalink }}" class="post-card__media post-card__media--{{ $variant }}" aria-hidden="true">
		<i class="fas fa-coffee"></i>
	</a>
	<div class="post-card__body">
		<span class="post-card__date">{{ $post.Date.Format "2 Jan, 2006" }} · {{ $post.ReadingTime }} min</span>
		<h3 class="post-card__title"><a href="{{ $post.Permalink }}">{{ $post.Title | markdownify }}</a></h3>
		<p class="post-card__excerpt">{{ with $post.Description }}{{ . | markdownify }}{{ else }}{{ $post.Summary }}{{ end }}</p>
		<a class="post-card__link" href="{{ $post.Permalink }}">Continuar lendo <i class="fas fa-chevron-right"></i></a>
	</div>
</article>
